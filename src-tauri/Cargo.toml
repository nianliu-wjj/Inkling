[package]
name = "inkling"
version = "0.1.0"
description = "Inkling 念头捕手桌面应用"
authors = ["Inkling Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
arboard = "3"
window-vibrancy = "0.6"
tokio = { version = "1", features = ["time"] }
image = { version = "0.25", default-features = false, features = ["png"] }
pulldown-cmark = "0.13"
ab_glyph = "0.2"
genpdfi = "0.2.7"
enigo = "0.6.1"

# 仅 Windows：设置 DWM 窗口圆角（Win11）。Mica / Acrylic 由 DWM 在窗口矩形上绘制，
# CSS 的 clip-path 只能裁 WebView 内容，裁不掉底下这层系统背景，四角仍是方的。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
