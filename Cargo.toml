[package]
name = "inkling"
description = "Inkling（念头捕手）桌面端 — GPUI 实现"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
paste = "1"
unicode-segmentation = "1"
global-hotkey = "0.6"
device_query = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tray-icon = "0.19.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1
