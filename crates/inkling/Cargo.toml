[package]
name = "inkling"
description = "Inkling（念头捕手）桌面端 — GPUI 实现"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[build-dependencies]
winresource = "0.1"
